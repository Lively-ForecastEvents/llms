name: dependabot-automerge

on:
  pull_request:

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: Lively-ForecastEvents/security-hub/.github/workflows/automerge.yml@main
    permissions:
      contents: write
      pull-requests: write
    # If the build needs public placeholder variables, pass them like this:
    # with:
    #   build-env: |
    #     NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
